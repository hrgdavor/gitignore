name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The project's build.zig refuses any compiler but 0.17 on purpose: that version moved the whole std.Io
      # surface, so a different minor does not build this code. If 0.17 is not yet in the release index, pin the
      # dev snapshot this project was verified against instead of loosening the build's own check.
      - uses: mlugg/setup-zig@53fc45b17fe98b52f92ee5ea08ff48a85a3e7eb7 # v1
        with:
          version: 0.17.0

      - name: Zig reference (matcher, chain, vectors)
        run: zig build test --summary all

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      # The JS port is measured, not trusted: this runs all three vector documents it runs locally.
      - name: JS port against the vectors
        run: bun js/conformance.mjs

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"

      # The Java port compiles itself with javac, so no Maven and no test framework: bun java/run.mjs is the gate.
      - name: Java port against the vectors
        run: bun java/run.mjs

      # The vectors say what to decide; this says the three ports decide the same thing on real workloads.
      - name: Three ports agree on the bench workloads
        run: zig build && bun scripts/check-verdicts.mjs
